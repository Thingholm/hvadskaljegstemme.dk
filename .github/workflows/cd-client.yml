name: CD Client

on:
  push:
    branches: ["main"]
    paths:
      - "client/**"
  workflow_dispatch:
    
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy-client:
    runs-on: ubuntu-24.04-arm
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: "24.10"
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Test
        run: npm test
        working-directory: ./client

      - name: Build
        run: npm run build
        working-directory: ./client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with: 
          role-to-assume: arn:aws:iam::278584440423:role/github-actions-deploy-s3-hvadskaljegstemme
          aws-region: eu-north-1

      - name: Deploy to S3
        run: | 
              aws s3 sync ./client/dist s3://hsjs-website-prod \
                --exclude "index.html" \
                --cache-control "public,max-age=31536000,immutable" \
                --delete
              aws s3 cp ./client/dist/index.html s3://hsjs-website-prod/index.html \
                --cache-control "public,max-age=60"

