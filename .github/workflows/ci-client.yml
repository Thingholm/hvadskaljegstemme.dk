name: CI Client

on:
  pull_request:
    branches: [main]
    paths:
      - "client/**"

jobs:
  build-client:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup Node.js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '24.10'

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Test
        run: npm test
        working-directory: ./client


      - name: Build
        run: npm run build
        working-directory: ./client