name: CI Server

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"

jobs:
  build-server:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release
        working-directory: ./server